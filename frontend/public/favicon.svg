<svg viewBox="0 0 120 120" width="120" height="120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="fav-cross" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="fav-pulse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="fav-cross-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#091e42" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#fav-bg)" />
  <rect x="6" y="6" width="108" height="108" rx="28" fill="none" stroke="url(#fav-border)" stroke-width="2.5" />

  <!-- Radar Telemetry Rings -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3 4" />

  <!-- Medical Cross -->
  <g filter="url(#fav-cross-shadow)">
    <rect x="47" y="22" width="26" height="76" rx="10" fill="url(#fav-cross)" />
    <rect x="22" y="47" width="76" height="26" rx="10" fill="url(#fav-cross)" />
  </g>

  <!-- Orbital Rebalancing Accents -->
  <path d="M 30 28 C 48 16, 74 18, 92 30" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" fill="none" />
  <path d="M 90 92 C 72 104, 46 102, 28 90" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" fill="none" />

  <!-- Vital ECG / Supply Pulse -->
  <path d="M 22 60 L 42 60 L 47 60 L 53 38 L 59 78 L 65 48 L 70 64 L 75 60 L 98 60" fill="none" stroke="url(#fav-pulse)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Telemetry Grid Nodes -->
  <circle cx="26" cy="60" r="3" fill="#38bdf8" />
  <circle cx="53" cy="38" r="3.5" fill="#34d399" />
  <circle cx="94" cy="60" r="3" fill="#10b981" />
</svg>