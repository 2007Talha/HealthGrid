version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: swasthya-backend
    ports:
      - "8000:8000"
    environment:
      - GCP_PROJECT_ID=arcadeaiagent
      - BIGQUERY_DATASET=swasthyagrid
      - BIGQUERY_LOCATION=asia-south1
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://127.0.0.1:80
      - RATE_LIMIT_PER_MINUTE=60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: swasthya-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
